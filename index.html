<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="オセロ (Reversi) ゲーム — GitHub Pages版" />
  <title>Reversi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>Reversi</h1>
  </header>

  <main>

    <!-- Score panel — populated dynamically by JS -->
    <div class="score-panel" id="score-panel" aria-label="スコア"></div>

    <!-- Status message -->
    <div id="status" class="status status--turn" role="status" aria-live="polite">
      赤の番です
    </div>

    <!-- Game board -->
    <div id="board-container" aria-label="オセロボード"></div>

    <!-- Controls -->
    <div class="controls">
      <button id="btn-reset" class="btn btn--primary">最初から</button>

      <label class="size-select-label" for="player-count">
        人数
        <select id="player-count" class="size-select" aria-label="プレイヤー人数を選択">
          <option value="2" selected>2人</option>
          <option value="3">3人</option>
          <option value="4">4人</option>
        </select>
      </label>

      <label class="size-select-label" for="board-size">
        盤面サイズ
        <select id="board-size" class="size-select" aria-label="盤面サイズを選択">
          <option value="4">4 × 4</option>
          <option value="6">6 × 6</option>
          <option value="8" selected>8 × 8</option>
          <option value="10">10 × 10</option>
          <option value="12">12 × 12</option>
          <option value="14">14 × 14</option>
          <option value="16">16 × 16</option>
          <option value="18">18 × 18</option>
          <option value="20">20 × 20</option>
          <option value="22">22 × 22</option>
          <option value="24">24 × 24</option>
          <option value="26">26 × 26</option>
          <option value="28">28 × 28</option>
          <option value="30">30 × 30</option>
          <option value="32">32 × 32</option>
        </select>
      </label>

      <label class="hint-toggle">
        <input type="checkbox" id="toggle-hints" checked />
        置ける場所を表示
      </label>
    </div>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
